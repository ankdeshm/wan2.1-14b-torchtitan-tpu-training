apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hyperdisk-balanced-tpu
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tpu-models-gcs-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 10Ti
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcsfuse-sc
  claimRef:
    namespace: default
    name: tpu-models-gcs-pvc
  mountOptions:
  - implicit-dirs
  - metadata-cache:negative-ttl-secs:0
  - metadata-cache:ttl-secs:-1
  - metadata-cache:stat-cache-max-size-mb:-1
  - metadata-cache:type-cache-max-size-mb:-1
  - file-system:kernel-list-cache-ttl-secs:-1
  - read:enable-buffered-read:true
  - read_ahead_kb=131072
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: YOUR_GCS_BUCKET
    volumeAttributes:
      skipCSIBucketAccessCheck: "true"
      gcsfuseMetadataPrefetchOnMount: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tpu-models-gcs-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Ti
  volumeName: tpu-models-gcs-pv
  storageClassName: gcsfuse-sc
